{# prettier-ignore #} {% extends 'frontend/base.html' %} {% block title %}Login
- Hardware POS{% endblock %} {% block content %}
<div class="flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <div class="text-center mb-8">
      <i class="fas fa-tools text-5xl text-blue-600 mb-4"></i>
      <h1 class="text-3xl font-bold text-gray-800">Hardware POS</h1>
      <p class="text-gray-600">Sign in to continue</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-4">
        <label
          class="block text-gray-700 text-sm font-bold mb-2"
          for="username"
        >
          Username
        </label>
        <input
          type="text"
          name="username"
          id="username"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
        />
      </div>

      <div class="mb-6">
        <label
          class="block text-gray-700 text-sm font-bold mb-2"
          for="password"
        >
          Password
        </label>
        <input
          type="password"
          name="password"
          id="password"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition"
      >
        <i class="fas fa-sign-in-alt mr-2"></i>Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
